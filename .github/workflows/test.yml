name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # All four student platforms, because the install story is the point.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[seismic,test]"

      - name: Test
        run: pytest -q

      - name: CLI smoke test
        run: shallowgeo info
