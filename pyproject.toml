[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shallow-geophysics"
version = "0.0.1.dev0"
description = "Unified data readers and joint modeling on a common subsurface grid for near-surface geophysics"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jeremy Maurer", email = "jmaurer@mst.edu" }]
# The <3.13 cap that pyGIMLi needs lives in pixi.toml, where the conda
# environment is solved. The readers themselves have no such constraint.
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
seismic = ["obspy>=1.4"]
masw = ["disba>=0.6", "evodcinv>=2.2"]
model = ["discretize>=0.10", "xarray>=2024.1", "netCDF4>=1.6"]
invert = ["simpeg>=0.22", "pygimli>=1.5"]
test = ["pytest>=7", "pytest-cov"]

# --- Driver registry -------------------------------------------------------
# Third-party packages add readers by advertising this same entry-point group.
[project.entry-points."shallowgeo.drivers"]
geode-seg2 = "shallowgeo.drivers.geode_seg2:driver"
atom-seg2  = "shallowgeo.drivers.atom_seg2:driver"
cg5        = "shallowgeo.drivers.cg5:driver"
g857       = "shallowgeo.drivers.g857:driver"

[project.scripts]
shallowgeo = "shallowgeo.cli:main"

[project.urls]
Homepage = "https://github.com/Maurer-GEMLab/shallow-geophysics"
Issues = "https://github.com/Maurer-GEMLab/shallow-geophysics/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/shallowgeo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
